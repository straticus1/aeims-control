---
# Secrets configuration for AEIMS
# This file should be encrypted with ansible-vault in production

# Database Passwords
aeims_core_db_pass: "{{ vault_aeims_core_db_pass | default('secure_password_123') }}"
aeims_app_db_pass: "{{ vault_aeims_app_db_pass | default('secure_password_123') }}"
redis_password: "{{ vault_redis_password | default('secure_redis_pass') }}"

# Admin Tokens
aeims_admin_token: "{{ vault_aeims_admin_token | default('admin-token-change-in-production') }}"
grafana_admin_password: "{{ vault_grafana_admin_password | default('admin123') }}"

# API Keys
aeims_api_key: "{{ vault_aeims_api_key | default('api-key-change-in-production') }}"
webhook_secret: "{{ vault_webhook_secret | default('webhook-secret-change-in-production') }}"

# JWT Configuration
jwt_secret: "{{ vault_jwt_secret | default('jwt-secret-key-change-in-production') }}"

# AWS Credentials (for development only - use IAM roles in production)
aws_access_key_id: "{{ vault_aws_access_key_id | default('') }}"
aws_secret_access_key: "{{ vault_aws_secret_access_key | default('') }}"

# SSL Certificates
ssl_cert_content: "{{ vault_ssl_cert_content | default('') }}"
ssl_key_content: "{{ vault_ssl_key_content | default('') }}"

# SMTP Configuration
smtp_password: "{{ vault_smtp_password | default('') }}"

# Slack Integration
slack_webhook_url: "{{ vault_slack_webhook_url | default('') }}"

# Third-party API Keys
sentry_dsn: "{{ vault_sentry_dsn | default('') }}"

# FreeSWITCH Configuration
freeswitch_password: "{{ vault_freeswitch_password | default('ClueCon') }}"

# Encryption Keys
encryption_key: "{{ vault_encryption_key | default('encryption-key-change-in-production') }}"