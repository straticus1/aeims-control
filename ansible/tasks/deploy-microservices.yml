---
# Deploy AEIMS Microservices
# Deploys all the microservices that make up the AEIMS Core platform

- name: Deploy microservices
  block:
    - name: Update ECS services (microservices)
      ecs_service:
        name: "{{ project_name }}-{{ item.name }}-{{ environment }}"
        cluster: "{{ terraform_outputs.ecs_cluster_name }}"
        task_definition: "{{ project_name }}-{{ item.name }}-{{ environment }}"
        desired_count: "{{ item.replicas | default(1) }}"
        deployment_configuration:
          maximum_percent: 200
          minimum_healthy_percent: 50
        wait: true
        wait_timeout: 600
      loop:
        - { name: "user-service", port: 8001, replicas: 1 }
        - { name: "billing-service", port: 8002, replicas: 1 }
        - { name: "call-service", port: 8003, replicas: 1 }
        - { name: "operator-service", port: 8004, replicas: 1 }
        - { name: "conference-service", port: 8005, replicas: 1 }
        - { name: "notification-service", port: 8006, replicas: 1 }
        - { name: "analytics-service", port: 8007, replicas: 1 }
      when: environment in ['staging', 'prod']

    - name: Start microservice containers (dev)
      docker_container:
        name: "aeims-{{ item.name }}"
        image: "{{ item.name }}:latest"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ item.port }}:9000"
        networks:
          - name: aeims-integrated-network
        env:
          DB_HOST: aeims-core-postgres
          REDIS_HOST: aeims-redis
          REDIS_PASSWORD: "{{ redis_password | default('secure_redis_pass') }}"
          SERVICE_NAME: "{{ item.name }}"
          SERVICE_PORT: "9000"
          ENVIRONMENT: "{{ environment }}"
      loop:
        - { name: "user-service", port: 8001 }
        - { name: "billing-service", port: 8002 }
        - { name: "call-service", port: 8003 }
        - { name: "operator-service", port: 8004 }
        - { name: "conference-service", port: 8005 }
        - { name: "notification-service", port: 8006 }
        - { name: "analytics-service", port: 8007 }
      when: environment == 'dev'

- name: Wait for microservices to be healthy
  uri:
    url: "http://localhost:{{ item.port }}/health"
    method: GET
    status_code: 200
  register: service_health
  until: service_health.status == 200
  retries: 20
  delay: 5
  loop:
    - { name: "user-service", port: 8001 }
    - { name: "billing-service", port: 8002 }
    - { name: "call-service", port: 8003 }
    - { name: "operator-service", port: 8004 }
    - { name: "conference-service", port: 8005 }
    - { name: "notification-service", port: 8006 }
    - { name: "analytics-service", port: 8007 }

- name: Deploy React Frontend
  block:
    - name: Update ECS service (Frontend)
      ecs_service:
        name: "{{ project_name }}-frontend-{{ environment }}"
        cluster: "{{ terraform_outputs.ecs_cluster_name }}"
        task_definition: "{{ project_name }}-frontend-{{ environment }}"
        desired_count: 1
        deployment_configuration:
          maximum_percent: 200
          minimum_healthy_percent: 50
        wait: true
        wait_timeout: 600
      when: environment in ['staging', 'prod']

    - name: Start Frontend container (dev)
      docker_container:
        name: aeims-frontend
        image: "frontend:latest"
        state: started
        restart_policy: unless-stopped
        ports:
          - "3000:3000"
        networks:
          - name: aeims-integrated-network
        env:
          REACT_APP_API_BASE_URL: "http://aeims-core:8000"
          REACT_APP_WS_URL: "ws://aeims-lib:8080"
          REACT_APP_ENVIRONMENT: "{{ environment }}"
      when: environment == 'dev'

- name: Wait for Frontend to be healthy
  uri:
    url: "http://localhost:3000/"
    method: GET
    status_code: 200
  register: frontend_health
  until: frontend_health.status == 200
  retries: 20
  delay: 5

- name: Log microservices deployment status
  debug:
    msg: "All microservices and frontend deployed successfully"