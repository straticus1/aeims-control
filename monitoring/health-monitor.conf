# AEIMS Centralized Health Monitoring Configuration
# Nginx configuration for health check aggregation

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/health-access.log;
    error_log /var/log/nginx/health-error.log;

    # Upstream services for health checks
    upstream aeims-core {
        server aeims-core:8000;
    }

    upstream aeims-app {
        server aeims-app:80;
    }

    upstream aeims-lib {
        server aeims-lib:8080;
    }

    upstream aeims-frontend {
        server aeims-frontend:3000;
    }

    # Health monitoring server
    server {
        listen 80;
        server_name localhost;

        # Combined health check endpoint
        location /health {
            add_header Content-Type application/json;

            # Use nginx subrequest module to check all services
            access_by_lua_block {
                local http = require "resty.http"
                local cjson = require "cjson"

                local services = {
                    { name = "aeims-core", url = "http://aeims-core:8000/health" },
                    { name = "aeims-app", url = "http://aeims-app/health.php" },
                    { name = "aeims-lib", url = "http://aeims-lib:8080/health" },
                    { name = "aeims-frontend", url = "http://aeims-frontend:3000/health" }
                }

                local results = {}
                local overall_status = "healthy"

                for _, service in ipairs(services) do
                    local httpc = http.new()
                    local res, err = httpc:request_uri(service.url, {
                        method = "GET",
                        timeout = 5000
                    })

                    if res and res.status == 200 then
                        results[service.name] = { status = "healthy", response_time = res.elapsed_time }
                    else
                        results[service.name] = { status = "unhealthy", error = err or "HTTP " .. (res and res.status or "timeout") }
                        overall_status = "degraded"
                    end
                end

                local response = {
                    overall_status = overall_status,
                    timestamp = ngx.time(),
                    services = results,
                    total_services = #services,
                    healthy_services = 0
                }

                for _, result in pairs(results) do
                    if result.status == "healthy" then
                        response.healthy_services = response.healthy_services + 1
                    end
                end

                ngx.say(cjson.encode(response))
                ngx.exit(overall_status == "healthy" and 200 or 503)
            }
        }

        # Individual service health checks
        location /health/core {
            proxy_pass http://aeims-core/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/app {
            proxy_pass http://aeims-app/health.php;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/lib {
            proxy_pass http://aeims-lib/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/frontend {
            proxy_pass http://aeims-frontend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Metrics endpoint for Prometheus
        location /metrics {
            add_header Content-Type text/plain;

            access_by_lua_block {
                local metrics = {}

                -- Generate Prometheus-style metrics
                table.insert(metrics, "# HELP aeims_service_up Service availability")
                table.insert(metrics, "# TYPE aeims_service_up gauge")

                local services = {"core", "app", "lib", "frontend"}
                for _, service in ipairs(services) do
                    -- This would normally query actual service status
                    table.insert(metrics, string.format('aeims_service_up{service="%s"} 1', service))
                end

                table.insert(metrics, "# HELP aeims_total_requests Total HTTP requests")
                table.insert(metrics, "# TYPE aeims_total_requests counter")
                table.insert(metrics, "aeims_total_requests " .. ngx.time())

                ngx.say(table.concat(metrics, "\n"))
            }
        }

        # Simple status page
        location /status {
            add_header Content-Type text/html;
            return 200 '
<!DOCTYPE html>
<html>
<head><title>AEIMS Health Status</title></head>
<body>
<h1>AEIMS System Status</h1>
<div id="status">Loading...</div>
<script>
fetch("/health")
    .then(r => r.json())
    .then(data => {
        document.getElementById("status").innerHTML =
            "<h2>Overall: " + data.overall_status + "</h2>" +
            "<p>Services: " + data.healthy_services + "/" + data.total_services + " healthy</p>" +
            "<ul>" + Object.keys(data.services).map(s =>
                "<li>" + s + ": " + data.services[s].status + "</li>"
            ).join("") + "</ul>";
    });
</script>
</body>
</html>';
        }
    }
}