# Sexacomms.com Client Portal Virtual Host
server {
    listen 80;
    server_name sexacomms.com www.sexacomms.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sexacomms.com www.sexacomms.com;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/sexacomms.com.crt;
    ssl_certificate_key /etc/ssl/private/sexacomms.com.key;
    
    # Security headers for adult content
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; media-src 'self' https:";

    # Client portal
    location / {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://aeims_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Client API
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        
        proxy_pass http://aeims_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Device control WebSocket
    location /ws/ {
        proxy_pass http://aeims_lib;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://aeims_app;
        access_log off;
    }
}
