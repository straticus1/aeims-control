# Admin.AEIMS.app Admin Interface Virtual Host
server {
    listen 80;
    server_name admin.aeims.app;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.aeims.app;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/admin.aeims.app.crt;
    ssl_certificate_key /etc/ssl/private/admin.aeims.app.key;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Admin interface authentication
    location /login {
        limit_req zone=login burst=10 nodelay;
        
        proxy_pass http://aeims_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin dashboard
    location / {
        limit_req zone=api burst=30 nodelay;
        
        proxy_pass http://aeims_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API endpoints
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        
        proxy_pass http://aeims_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://aeims_admin;
        access_log off;
    }
}
