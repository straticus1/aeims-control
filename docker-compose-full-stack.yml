version: '3.8'

services:
  # Redis - Caching and Session Store
  redis:
    image: redis:7-alpine
    container_name: aeims-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-aeimsredis2023}
    volumes:
      - redis_data:/data
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL - Main Database
  postgres:
    image: postgres:15
    container_name: aeims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeims}
      POSTGRES_USER: ${POSTGRES_USER:-aeims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeimspostgres2023}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeims} -d ${POSTGRES_DB:-aeims}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL - Legacy Support Database
  mysql:
    image: mysql:8.0
    container_name: aeims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aeimsroot2023}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aeims_legacy}
      MYSQL_USER: ${MYSQL_USER:-aeims}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aeimsmysql2023}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-aeimsroot2023}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AEIMS Library - Device Control WebSocket Server  
  aeims-lib:
    image: 515966511618.dkr.ecr.us-east-1.amazonaws.com/aeims-lib-dev:latest
    container_name: aeims-lib
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - WEBSOCKET_PORT=8080
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-aeimsredis2023}
      - JWT_SECRET=${JWT_SECRET:-aeims-jwt-secret-2023}
    depends_on:
      - redis
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AEIMS Core API - Main Application Backend
  aeims-core:
    image: 515966511618.dkr.ecr.us-east-1.amazonaws.com/aeims-core:latest
    container_name: aeims-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aeims}:${POSTGRES_PASSWORD:-aeimspostgres2023}@postgres:5432/${POSTGRES_DB:-aeims}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-aeimsredis2023}
      - JWT_SECRET=${JWT_SECRET:-aeims-jwt-secret-2023}
      - WEBSOCKET_URL=ws://aeims-lib:8080
    depends_on:
      - postgres
      - redis
      - aeims-lib
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AEIMS Admin Interface
  aeims-admin:
    image: 515966511618.dkr.ecr.us-east-1.amazonaws.com/aeims-admin:latest
    container_name: aeims-admin
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      - API_BASE_URL=http://aeims-core:8000
      - WEBSOCKET_URL=ws://aeims-lib:8080
    depends_on:
      - aeims-core
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AEIMS User Interface
  aeims-app:
    image: 515966511618.dkr.ecr.us-east-1.amazonaws.com/aeims-app:latest
    container_name: aeims-app
    restart: unless-stopped
    ports:
      - "8002:3000"
    environment:
      - REACT_APP_API_URL=http://aeims-core:8000
      - REACT_APP_WS_URL=ws://aeims-lib:8080
      - NODE_ENV=production
    depends_on:
      - aeims-core
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Load Balancer and Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aeims-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx-full-stack.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - aeims-lib
      - aeims-core
      - aeims-admin
      - aeims-app
    networks:
      - aeims-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  mysql_data:
    driver: local

networks:
  aeims-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
